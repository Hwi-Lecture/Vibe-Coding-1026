<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>난방 에너지 시세판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f3f4f5;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6b6a65;
  --line: #e3e2de;
  --grid: #ebeae6;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --bar-track: #f0efec;
  --font: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111112;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #9a998f;
    --line: #2e2d2a;
    --grid: #262624;
    --series-1: #3987e5;
    --series-2: #d95926;
    --bar-track: #242422;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111112;
  --surface: #1a1a19;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #9a998f;
  --line: #2e2d2a;
  --grid: #262624;
  --series-1: #3987e5;
  --series-2: #d95926;
  --bar-track: #242422;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 24px; padding-bottom: 4px; }
h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.meta { color: var(--muted); font-size: 12.5px; }
.meta b { color: var(--ink-2); font-weight: 500; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; min-width: 0; }
.card h2 { margin: 0; font-size: 14px; font-weight: 600; }
.sub { margin: 2px 0 0; color: var(--ink-2); font-size: 12.5px; text-wrap: pretty; }
.brief[hidden] { display: none; }
.brief-text { margin: 8px 0 0; font-size: 14.5px; line-height: 1.7; text-wrap: pretty; }
.brief-by { margin-top: 8px; color: var(--muted); font-size: 12px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; }

.hero { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 8px 28px; align-items: stretch; }
.hero-fig { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.hero-fig .label { color: var(--ink-2); font-size: 13px; }
.hero-val { font-size: 56px; line-height: 1.05; font-weight: 600; letter-spacing: -0.02em; }
.hero-val small { font-size: 16px; font-weight: 500; color: var(--ink-2); letter-spacing: 0; margin-left: 6px; }
.delta { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.delta b { color: var(--ink); font-weight: 600; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 16px; }
.tile { padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 2px; }
.tile .label { color: var(--ink-2); font-size: 12.5px; }
.tile .val { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.tile .val small { font-size: 12px; font-weight: 500; color: var(--ink-2); margin-left: 4px; }
.tile .spark { height: 38px; margin-top: 6px; }

.chart { position: relative; width: 100%; }
.chart svg { display: block; overflow: visible; }
.axis-text { fill: var(--muted); font-size: 11.5px; font-family: var(--font); }
.val-text { fill: var(--ink); font-size: 12px; font-weight: 600; font-family: var(--font); }

.legend { display: flex; gap: 16px; margin-top: 10px; color: var(--ink-2); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.rows { display: flex; flex-direction: column; margin-top: 10px; }
.drow { display: grid; grid-template-columns: 78px minmax(0, 1fr); align-items: center; min-height: 36px; }
.drow .name { color: var(--ink-2); font-size: 12.5px; }
.dplot { position: relative; height: 36px; }
.dplot::before { content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 1px; background: var(--line); }
.dbar { position: absolute; top: 8px; height: 20px; min-width: 3px; }
.dbar.up { left: 50%; background: var(--series-2); border-radius: 0 4px 4px 0; }
.dbar.down { right: 50%; background: var(--series-1); border-radius: 4px 0 0 4px; }
.dval { position: absolute; top: 0; height: 36px; display: flex; align-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

.mrow { display: grid; grid-template-columns: 62px minmax(0, 1fr) 46px; align-items: end; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.mrow:first-of-type { border-top: 0; }
.mrow .name { color: var(--ink-2); font-size: 12.5px; padding-bottom: 2px; }
.mrow .tot { color: var(--ink); font-size: 12px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; padding-bottom: 2px; }
.mini { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; height: 40px; }
.mini .col { flex: 0 1 24px; min-width: 6px; background: var(--series-1); border-radius: 3px 3px 0 0; min-height: 2px; }
.mini .col.zero { background: var(--line); }
.mhead { display: grid; grid-template-columns: 62px minmax(0, 1fr) 46px; gap: 8px; color: var(--muted); font-size: 11.5px; margin-top: 10px; }
.mhead .ax { display: flex; justify-content: space-between; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.tab { font: inherit; font-size: 12.5px; color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.tab:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.news { list-style: none; margin: 0; padding: 0; }
.news li { padding: 9px 0; border-top: 1px solid var(--line); }
.news li:first-child { border-top: 0; }
.news a { color: var(--ink); text-decoration: none; font-size: 13.5px; font-weight: 500; text-wrap: pretty; }
.news a:hover { text-decoration: underline; }
.news .by { color: var(--muted); font-size: 12px; margin-top: 1px; }

details { margin-top: 2px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; padding: 4px 0; }
.tbl { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { color: var(--muted); font-weight: 500; border-top: 0; }

#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; line-height: 1.4; padding: 6px 9px; border-radius: 6px; white-space: nowrap; opacity: 0; transition: opacity .08s; font-variant-numeric: tabular-nums; }

@media (max-width: 720px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .hero-val { font-size: 48px; }
  .card { padding: 16px; }
  .tile .val { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) { #tip { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>난방 에너지 시세판</h1>
    <div class="meta" id="meta"></div>
  </header>

  <section class="card brief" id="brief" aria-labelledby="brief-title" hidden>
    <h2 id="brief-title">오늘의 브리핑</h2>
    <p class="brief-text" id="brief-text"></p>
    <div class="brief-by" id="brief-by"></div>
  </section>

  <section class="card hero" aria-labelledby="hero-title">
    <div class="hero-fig">
      <div class="label" id="hero-title">실내등유 전국 평균 판매가</div>
      <div class="hero-val" id="hero-val"></div>
      <div class="delta" id="hero-delta"></div>
    </div>
    <div>
      <h2>실내등유 7일 가격 추이</h2>
      <p class="sub" id="hero-sub"></p>
      <div class="chart" id="hero-chart" style="height:220px"></div>
    </div>
  </section>

  <section class="tiles" id="tiles" aria-label="다른 제품 가격"></section>

  <div class="grid-2">
    <section class="card">
      <h2>7일간 가격 변화</h2>
      <p class="sub" id="chg-sub"></p>
      <div class="rows" id="chg-rows"></div>
      <div class="legend"><span><i class="sw" style="background:var(--series-2)"></i>상승</span><span><i class="sw" style="background:var(--series-1)"></i>하락</span><span>단위 원/L</span></div>
    </section>
    <section class="card">
      <h2>경유와 등유의 가격 차이</h2>
      <p class="sub" id="spread-sub"></p>
      <div class="chart" id="spread-chart" style="height:210px"></div>
    </section>
  </div>

  <div class="grid-2">
    <section class="card">
      <h2>키워드별 일별 뉴스 기사 수</h2>
      <p class="sub" id="news-sub"></p>
      <div class="mhead"><span></span><span class="ax"><span id="d-first"></span><span id="d-last"></span></span><span></span></div>
      <div id="news-rows"></div>
    </section>
    <section class="card">
      <h2>최신 헤드라인</h2>
      <div class="tabs" role="tablist" id="tabs"></div>
      <ul class="news" id="headlines"></ul>
    </section>
  </div>

  <section class="card">
    <details>
      <summary>표로 보기</summary>
      <div class="tbl"><table id="price-table"></table></div>
      <div class="tbl"><table id="news-table"></table></div>
    </details>
  </section>
</div>
<div id="tip" role="status"></div>

<script src="data/dashboard-data.js"></script>
<script>
(function () {
  var D = window.DASHBOARD_DATA;
  var P = D.prices, N = D.news;
  var NAMES = P.products;
  var ORDER_TILES = ['D047', 'B027', 'B034', 'K015'];
  var WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  var $ = function (id) { return document.getElementById(id); };
  var MINUS = '−';

  function fmt(v, d) { return v.toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function signed(v, d) { var s = fmt(Math.abs(v), d); return v > 0 ? '+' + s : v < 0 ? MINUS + s : s; }
  function md(date) { return date.slice(5).replace('-', '.'); }
  function mdw(date) { return md(date) + '(' + WEEK[new Date(date + 'T00:00:00+09:00').getDay()] + ')'; }
  function kstTime(iso) {
    var p = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date(iso));
    var g = function (t) { return p.filter(function (x) { return x.type === t; })[0].value; };
    return g('month') + '.' + g('day') + ' ' + g('hour') + ':' + g('minute');
  }
  function last(a) { return a[a.length - 1]; }

  var tip = $('tip');
  function showTip(html, cx, cy) {
    tip.innerHTML = html;
    tip.style.opacity = 1;
    var r = tip.getBoundingClientRect();
    var x = Math.min(cx + 14, window.innerWidth - r.width - 8);
    var y = cy - r.height - 12 < 4 ? cy + 16 : cy - r.height - 12;
    tip.style.left = Math.max(4, x) + 'px';
    tip.style.top = y + 'px';
  }
  function hideTip() { tip.style.opacity = 0; }

  function niceStep(raw) {
    var p = Math.pow(10, Math.floor(Math.log10(raw)));
    var f = raw / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
  }
  function scale(values) {
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    if (max - min < 1e-9) { min -= 0.5; max += 0.5; }
    var step = niceStep((max - min) / 3);
    var lo = Math.floor(min / step + 1e-9) * step, hi = Math.ceil(max / step - 1e-9) * step;
    if (lo === min) lo -= step;
    if (hi === max) hi += step;
    var dec = step >= 1 ? 0 : Math.min(2, Math.ceil(-Math.log10(step) - 1e-9));
    var ticks = [];
    for (var t = lo; t <= hi + step / 2; t += step) ticks.push(+t.toFixed(6));
    return { lo: lo, hi: hi, ticks: ticks, dec: dec };
  }

  function lineChart(host, o) {
    function draw() {
      var w = host.clientWidth || 600, h = o.height;
      var m = { l: 56, r: 76, t: 12, b: 28 };
      var sc = scale(o.values), n = o.values.length;
      var x = function (i) { return m.l + (w - m.l - m.r) * (n === 1 ? 0.5 : i / (n - 1)); };
      var y = function (v) { return m.t + (h - m.t - m.b) * (1 - (v - sc.lo) / (sc.hi - sc.lo)); };
      var pts = o.values.map(function (v, i) { return x(i).toFixed(1) + ',' + y(v).toFixed(1); });
      var base = (h - m.b).toFixed(1);
      var s = '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + o.aria + '">';
      sc.ticks.forEach(function (t) {
        s += '<line x1="' + m.l + '" x2="' + (w - m.r) + '" y1="' + y(t).toFixed(1) + '" y2="' + y(t).toFixed(1) + '" stroke="var(--grid)" stroke-width="1"/>';
        s += '<text class="axis-text" x="' + (m.l - 10) + '" y="' + (y(t) + 4).toFixed(1) + '" text-anchor="end">' + fmt(t, sc.dec) + '</text>';
      });
      var skip = (w - m.l - m.r) / n < 46 ? 2 : 1;
      o.dates.forEach(function (d, i) {
        if (i % skip && i !== n - 1) return;
        s += '<text class="axis-text" x="' + x(i).toFixed(1) + '" y="' + (h - 8) + '" text-anchor="middle">' + md(d) + '</text>';
      });
      s += '<polygon points="' + x(0).toFixed(1) + ',' + base + ' ' + pts.join(' ') + ' ' + x(n - 1).toFixed(1) + ',' + base + '" fill="' + o.color + '" fill-opacity="0.1"/>';
      s += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + o.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      s += '<g id="hv" style="display:none"><line y1="' + m.t + '" y2="' + base + '" stroke="var(--muted)" stroke-width="1"/><circle r="5" fill="' + o.color + '" stroke="var(--surface)" stroke-width="2"/></g>';
      var lx = x(n - 1), ly = y(last(o.values));
      s += '<circle cx="' + lx.toFixed(1) + '" cy="' + ly.toFixed(1) + '" r="4.5" fill="' + o.color + '" stroke="var(--surface)" stroke-width="2"/>';
      s += '<text class="val-text" x="' + (lx + 11).toFixed(1) + '" y="' + (ly + 4).toFixed(1) + '">' + fmt(last(o.values), 2) + '</text>';
      s += '<rect x="' + m.l + '" y="0" width="' + (w - m.l - m.r) + '" height="' + h + '" fill="transparent" id="hit"/>';
      s += '</svg>';
      host.innerHTML = s;
      var hv = host.querySelector('#hv'), line = hv.querySelector('line'), dot = hv.querySelector('circle');
      var hit = host.querySelector('#hit');
      hit.addEventListener('pointermove', function (e) {
        var r = host.getBoundingClientRect();
        var i = Math.round(((e.clientX - r.left) - m.l) / (w - m.l - m.r) * (n - 1));
        i = Math.max(0, Math.min(n - 1, i));
        hv.style.display = '';
        line.setAttribute('x1', x(i)); line.setAttribute('x2', x(i));
        dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(o.values[i]));
        showTip(mdw(o.dates[i]) + '<br><b>' + fmt(o.values[i], 2) + '원</b> ' + o.name, e.clientX, e.clientY);
      });
      hit.addEventListener('pointerleave', function () { hv.style.display = 'none'; hideTip(); });
    }
    draw();
    var lastW = host.clientWidth;
    new ResizeObserver(function () { if (host.clientWidth !== lastW) { lastW = host.clientWidth; draw(); } }).observe(host);
  }

  function spark(host, values, dates, name) {
    function draw() {
      var w = host.clientWidth || 200, h = 38, pad = 5;
      var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
      var span = max - min || 1;
      var x = function (i) { return pad + (w - 2 * pad - 6) * i / (values.length - 1); };
      var y = function (v) { return pad + (h - 2 * pad) * (1 - (v - min) / span); };
      var pts = values.map(function (v, i) { return x(i).toFixed(1) + ',' + y(v).toFixed(1); }).join(' ');
      host.innerHTML = '<svg width="' + w + '" height="' + h + '" role="img" aria-label="' + name + ' 7일 추이"><polyline points="' + pts + '" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="' + x(values.length - 1).toFixed(1) + '" cy="' + y(last(values)).toFixed(1) + '" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"/><rect width="' + w + '" height="' + h + '" fill="transparent"/></svg>';
      var hit = host.querySelector('rect');
      hit.addEventListener('pointermove', function (e) {
        var r = host.getBoundingClientRect();
        var i = Math.round((e.clientX - r.left - pad) / (w - 2 * pad - 6) * (values.length - 1));
        i = Math.max(0, Math.min(values.length - 1, i));
        showTip(mdw(dates[i]) + '<br><b>' + fmt(values[i], 2) + '원</b> ' + name, e.clientX, e.clientY);
      });
      hit.addEventListener('pointerleave', hideTip);
    }
    draw();
    var lastW = host.clientWidth;
    new ResizeObserver(function () { if (host.clientWidth !== lastW) { lastW = host.clientWidth; draw(); } }).observe(host);
  }

  if (D.briefing && D.briefing.text) {
    $('brief-text').textContent = D.briefing.text;
    $('brief-by').textContent = 'AI(' + D.briefing.model + ')가 아래 데이터를 요약한 글입니다 · ' + kstTime(D.briefing.generatedAt) + ' 생성';
    $('brief').hidden = false;
  }

  var dates = P.dates, S = P.series;
  var lastDate = last(dates);
  $('meta').innerHTML = '가격 <b>' + md(lastDate) + '</b> 기준 · 뉴스 <b>' + md(last(N.dates)) + '</b>까지 · 출처 한국석유공사 오피넷, Google 뉴스';

  var kero = S.C004, kv = last(kero), kd = kv - kero[kero.length - 2];
  var kr = Math.max.apply(null, kero) - Math.min.apply(null, kero);
  $('hero-val').innerHTML = fmt(kv, 2) + '<small>원/L</small>';
  $('hero-delta').innerHTML = '전일 대비 <b>' + signed(kd, 2) + '원</b><br>7일 변동폭 <b>' + fmt(kr, 2) + '원</b>';
  var ks = scale(kero);
  $('hero-sub').textContent = '변동이 작아 세로축을 ' + fmt(ks.lo, ks.dec) + '~' + fmt(ks.hi, ks.dec) + '원 구간으로 확대해 그렸습니다.';
  lineChart($('hero-chart'), { values: kero, dates: dates, color: 'var(--series-1)', height: 220, name: NAMES.C004, aria: '실내등유 7일 가격 추이' });

  var tiles = '';
  ORDER_TILES.forEach(function (c) {
    var v = S[c], d = last(v) - v[v.length - 2];
    tiles += '<div class="card tile"><div class="label">' + NAMES[c] + '</div><div class="val">' + fmt(last(v), 2) + '<small>원/L</small></div><div class="delta">전일 대비 <b>' + signed(d, 2) + '</b></div><div class="spark" id="sp-' + c + '"></div></div>';
  });
  $('tiles').innerHTML = tiles;
  ORDER_TILES.forEach(function (c) { spark($('sp-' + c), S[c], dates, NAMES[c]); });

  var chg = Object.keys(NAMES).map(function (c) { return { c: c, name: NAMES[c], v: last(S[c]) - S[c][0] }; }).sort(function (a, b) { return b.v - a.v; });
  var maxAbs = Math.max.apply(null, chg.map(function (r) { return Math.abs(r.v); }));
  var others = chg.slice(1).every(function (r) { return Math.abs(r.v) < 1; });
  $('chg-sub').textContent = (chg[0].v > 0 && others)
    ? chg[0].name + '만 ' + fmt(chg[0].v, 2) + '원 올랐고, 나머지는 모두 1원 안쪽에서 움직였습니다.'
    : md(dates[0]) + '부터 ' + md(lastDate) + '까지 제품별 가격 변화입니다.';
  var rows = '';
  chg.forEach(function (r) {
    var wpct = Math.abs(r.v) / maxAbs * 38, up = r.v >= 0;
    rows += '<div class="drow"><div class="name">' + r.name + '</div><div class="dplot" data-t="' + r.name + '|' + signed(r.v, 2) + '">'
      + '<div class="dbar ' + (up ? 'up' : 'down') + '" style="width:' + wpct.toFixed(2) + '%"></div>'
      + '<div class="dval" style="' + (up ? 'left:calc(50% + ' + wpct.toFixed(2) + '% + 8px)' : 'right:calc(50% + ' + wpct.toFixed(2) + '% + 8px)') + '">' + signed(r.v, 2) + '</div></div></div>';
  });
  $('chg-rows').innerHTML = rows;
  Array.prototype.forEach.call(document.querySelectorAll('.dplot'), function (el) {
    el.addEventListener('pointermove', function (e) { var t = el.dataset.t.split('|'); showTip(t[0] + '<br><b>' + t[1] + '원</b> (' + md(dates[0]) + '→' + md(lastDate) + ')', e.clientX, e.clientY); });
    el.addEventListener('pointerleave', hideTip);
  });

  var spread = S.D047.map(function (v, i) { return v - S.C004[i]; });
  var sr = Math.max.apply(null, spread) - Math.min.apply(null, spread);
  $('spread-sub').textContent = '경유가 등유보다 ' + fmt(last(spread), 0) + '원 비쌉니다. 7일 동안 차이는 ' + fmt(sr, 2) + '원 안에서 움직였습니다.';
  lineChart($('spread-chart'), { values: spread, dates: dates, color: 'var(--series-1)', height: 210, name: '경유−등유', aria: '경유와 등유 가격 차이 7일 추이' });

  var nd = N.dates;
  $('d-first').textContent = md(nd[0]);
  $('d-last').textContent = md(last(nd));
  var gmax = Math.max.apply(null, N.keywords.map(function (k) { return Math.max.apply(null, N.daily[k]); }));
  var tops = N.keywords.map(function (k) { return { k: k, t: N.daily[k].reduce(function (a, b) { return a + b; }, 0) }; }).sort(function (a, b) { return b.t - a.t; });
  $('news-sub').textContent = '7일 동안 "' + tops[0].k + '" 기사가 ' + tops[0].t + '건으로 가장 많았습니다. RSS가 키워드당 100건만 내려주므로, 기사가 많은 키워드는 오래된 날이 덜 집계될 수 있습니다.';
  var mr = '';
  N.keywords.forEach(function (k) {
    var tot = N.daily[k].reduce(function (a, b) { return a + b; }, 0);
    mr += '<div class="mrow"><div class="name">' + k + '</div><div class="mini">';
    N.daily[k].forEach(function (c, i) {
      mr += '<div class="col' + (c ? '' : ' zero') + '" style="height:' + (c ? Math.max(2, c / gmax * 40).toFixed(1) : 2) + 'px" data-t="' + k + '|' + mdw(nd[i]) + '|' + c + '"></div>';
    });
    mr += '</div><div class="tot">' + tot + '건</div></div>';
  });
  $('news-rows').innerHTML = mr;
  Array.prototype.forEach.call(document.querySelectorAll('.col'), function (el) {
    el.addEventListener('pointermove', function (e) { var t = el.dataset.t.split('|'); showTip(t[0] + ' · ' + t[1] + '<br><b>' + t[2] + '건</b>', e.clientX, e.clientY); });
    el.addEventListener('pointerleave', hideTip);
  });

  var cur = N.keywords[0];
  function renderNews() {
    var t = '';
    N.keywords.forEach(function (k) { t += '<button class="tab" role="tab" aria-selected="' + (k === cur) + '" data-k="' + k + '">' + k + '</button>'; });
    $('tabs').innerHTML = t;
    var li = '';
    N.items[cur].slice(0, 5).forEach(function (n) {
      li += '<li><a href="' + n.url + '" target="_blank" rel="noopener noreferrer">' + n.title + '</a><div class="by">' + n.source + ' · ' + kstTime(n.publishedAt) + '</div></li>';
    });
    $('headlines').innerHTML = li;
  }
  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) { cur = b.dataset.k; renderNews(); } });
  renderNews();

  var th = '<thead><tr><th>날짜</th>';
  Object.keys(NAMES).forEach(function (c) { th += '<th>' + NAMES[c] + '</th>'; });
  th += '</tr></thead><tbody>';
  dates.forEach(function (d, i) {
    th += '<tr><td>' + mdw(d) + '</td>';
    Object.keys(NAMES).forEach(function (c) { th += '<td>' + fmt(S[c][i], 2) + '</td>'; });
    th += '</tr>';
  });
  $('price-table').innerHTML = th + '</tbody>';
  var nt = '<thead><tr><th>날짜</th>';
  N.keywords.forEach(function (k) { nt += '<th>' + k + '</th>'; });
  nt += '</tr></thead><tbody>';
  nd.forEach(function (d, i) {
    nt += '<tr><td>' + mdw(d) + '</td>';
    N.keywords.forEach(function (k) { nt += '<td>' + N.daily[k][i] + '</td>'; });
    nt += '</tr>';
  });
  $('news-table').innerHTML = nt + '</tbody>';
})();
</script>
</body>
</html>
