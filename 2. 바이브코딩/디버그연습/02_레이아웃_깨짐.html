<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>팀 업무 대시보드</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f3f6fb;color:#26324a}header{background:#263c78;color:white;padding:24px 8%}header h1{margin:0;font-size:25px}main{max-width:1100px;margin:40px auto;padding:0 24px}h2{margin-bottom:6px}.sub{color:#68748a;margin-bottom:25px}.cards{display:flex;gap:20px}.card{background:white;border-radius:12px;padding:24px;box-shadow:0 5px 20px #1e305014;flex:1;min-width:0;height:135px;overflow:hidden}.card h3{margin:0 0 12px;color:#64748b;font-size:16px}.value{font-size:34px;font-weight:700;color:#334e9d}.notice{margin-top:28px;background:white;border-radius:12px;padding:24px;position:relative;z-index:1}.notice li{padding:9px 0}body{overflow-x:hidden}.controls{margin:0 0 24px}.controls button{border:0;border-radius:8px;padding:10px 16px;background:#334e9d;color:white;font:inherit;cursor:pointer}.controls button:hover{background:#263c78}.yesterday-summary{display:none;position:absolute;left:0;right:0;top:100%;margin-top:12px;padding:22px 24px;background:white;border:1px solid #dbe3f1;border-radius:12px;box-shadow:0 8px 24px #1e30501c;z-index:2}.controls{position:relative}.yesterday-summary.visible{display:block}.yesterday-summary h3{margin:0 0 10px;color:#334e9d}.yesterday-summary p{margin:0;line-height:1.65}.controls{margin-bottom:24px}
</style></head><body><header><h1>📊 팀 업무 대시보드</h1></header><main><h2>오늘의 업무 현황</h2><p class="sub">팀의 주요 업무를 한눈에 확인하세요.</p><div class="controls"><button id="summaryButton" type="button" aria-expanded="false">어제 있었던 일 요약</button><section class="yesterday-summary" id="yesterdaySummary" aria-live="polite"><h3>어제 업무 요약</h3><p>신규 요청 5건을 접수했고, 진행 중이던 업무 3건을 완료했습니다. 오후에는 주간 회의에서 일정과 담당자를 조정했습니다.</p></section></div><section class="cards" id="summaryCards"><article class="card"><h3>진행 중인 업무</h3><div class="value">12건</div></article><article class="card"><h3>오늘 마감</h3><div class="value">3건</div></article><article class="card"><h3>이번 주 완료</h3><div class="value">8건</div></article></section><section class="notice"><h3>📌 오늘의 공지</h3><ul><li>오후 2시 주간 업무 회의</li><li>금요일까지 업무 현황 업데이트</li><li>공유 문서 최신 버전 확인</li></ul></section></main><script>const summaryButton=document.getElementById('summaryButton');const yesterdaySummary=document.getElementById('yesterdaySummary');summaryButton.addEventListener('click',()=>{const visible=!yesterdaySummary.classList.contains('visible');yesterdaySummary.classList.toggle('visible',visible);summaryButton.setAttribute('aria-expanded',String(visible))});</script></body></html>
